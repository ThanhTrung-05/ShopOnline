version: '3.8'

services:
  # 1. Oracle Database (19c)
  oracledb:
    image: gvenzl/oracle-xe:21-slim
    container_name: bhtt-oracle
    environment:
      - ORACLE_PASSWORD=banhang123
      - ORACLE_DATABASE=XEPDB1
    ports:
      - "1522:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    networks:
      - bhtt-network
    healthcheck:
      test: ["CMD", "sqlplus", "-L", "system/banhang123@localhost:1521/XEPDB1", "SELECT 1 FROM DUAL;"]
      interval: 30s
      timeout: 10s
      retries: 5

  # 2. Redis Cache
  redis:
    image: redis:7-alpine
    container_name: bhtt-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - bhtt-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Zookeeper (Required for Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: bhtt-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - bhtt-network

  # 4. Apache Kafka
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: bhtt-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - bhtt-network
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 5

  # 5. Spring Boot Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bhtt-backend
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - ORACLE_URL=jdbc:oracle:thin:@host.docker.internal:1521/XEPDB1
      - ORACLE_USER=BHTT
      - ORACLE_PASSWORD=123456
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    networks:
      - bhtt-network

  # 6. React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bhtt-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - bhtt-network

volumes:
  oracle-data:
  redis-data:

networks:
  bhtt-network:
    driver: bridge
