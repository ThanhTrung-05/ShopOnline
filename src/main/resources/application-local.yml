spring:
  datasource:
    url: ${ORACLE_URL:jdbc:oracle:thin:@localhost:1522/XEPDB1}
    username: ${ORACLE_USER}
    password: ${ORACLE_PASSWORD}
    # ATS-42: HikariCP connection pool — explicit config prevents silent use of defaults.
    # Local dev: pool-size=10 is sufficient for single-developer workload.
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 30000       # 30s — fail fast if all connections busy
      idle-timeout: 600000            # 10m — release idle connections
      max-lifetime: 1800000           # 30m — recycle connections (Oracle default timeout ~30m)
      validation-timeout: 5000        # 5s — quick validation
      pool-name: BHTTPool-Local
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  security:
    jwt:
      jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/shoponline/protocol/openid-connect/certs}
      issuer: ${KEYCLOAK_ISSUER:http://localhost:8081/realms/shoponline}
      audience: ${KEYCLOAK_AUDIENCE:shoponline-backend}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  keycloak:
    admin:
      base-url: ${KEYCLOAK_ADMIN_BASE_URL:http://localhost:8081}
      realm: ${KEYCLOAK_REALM:shoponline}
      client-id: ${KEYCLOAK_USER_ADMIN_CLIENT_ID:shoponline-user-admin}
      client-secret: ${KEYCLOAK_USER_ADMIN_CLIENT_SECRET:}
      backend-client-id: ${KEYCLOAK_BACKEND_CLIENT_ID:shoponline-backend}
      customer-role: ${KEYCLOAK_CUSTOMER_ROLE:CUSTOMER}
    payment:
      demo-mode: ${PAYMENT_DEMO_MODE:true}
      qr-expiry-minutes: ${PAYMENT_QR_EXPIRY_MINUTES:15}
      status-cache-ttl-seconds: ${PAYMENT_STATUS_CACHE_TTL:960}
    scheduler:
      payment-expiry-cron: ${PAYMENT_EXPIRY_CRON:0 */1 * * * *}
