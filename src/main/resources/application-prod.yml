spring:
  datasource:
    url: ${ORACLE_URL}
    username: ${ORACLE_USER}
    password: ${ORACLE_PASSWORD}
    # ATS-42: HikariCP — sized for production load. Override via env vars without code change.
    # For Flash Sale: raise DB_POOL_MAX (e.g. 30–50) and ensure Oracle listener can handle it.
    # Do NOT raise beyond Oracle session limit (default XE: 20 sessions).
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:10}
      connection-timeout: 20000       # 20s — faster fail-fast than local dev
      idle-timeout: 600000            # 10m
      max-lifetime: 1800000           # 30m — safe below Oracle idle session timeout
      validation-timeout: 3000        # 3s — tight for production
      pool-name: BHTTPool-Prod
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

app:
  security:
    jwt:
      jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}
      issuer: ${KEYCLOAK_ISSUER}
      audience: ${KEYCLOAK_AUDIENCE:shoponline-backend}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
  keycloak:
    admin:
      base-url: ${KEYCLOAK_ADMIN_BASE_URL}
      realm: ${KEYCLOAK_REALM}
      client-id: ${KEYCLOAK_USER_ADMIN_CLIENT_ID}
      client-secret: ${KEYCLOAK_USER_ADMIN_CLIENT_SECRET}
      backend-client-id: ${KEYCLOAK_BACKEND_CLIENT_ID:shoponline-backend}
      customer-role: ${KEYCLOAK_CUSTOMER_ROLE:CUSTOMER}
