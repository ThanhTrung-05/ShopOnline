spring:
  application:
    name: banhangtructuyen
  jackson:
    time-zone: Asia/Ho_Chi_Minh
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  redis:
    ttl:
      product-list: 300
      product-detail: 600
  security:
    jwt:
      jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/shoponline/protocol/openid-connect/certs}
      issuer: ${KEYCLOAK_ISSUER:http://localhost:8081/realms/shoponline}
      audience: ${KEYCLOAK_AUDIENCE:shoponline-backend}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
